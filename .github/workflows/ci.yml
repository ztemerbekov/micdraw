name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base, so a branch stacked on another
  # branch is checked too.
  pull_request:

jobs:
  test:
    strategy:
      # Let every system report, even when another one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

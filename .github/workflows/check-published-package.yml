name: Check published package

# Installs micdraw from npm and runs its CLI on Linux, macOS and Windows.
# CI tests the repository; this checks the package people install, which a
# missing file or a dependency that fails to install on one system would
# break.
on:
  # The release workflow calls this after it publishes.
  workflow_call:
    inputs:
      version:
        description: The version to check, without the leading "v".
        required: true
        type: string
  # A change to this check runs it against the version npm serves as latest.
  pull_request:
    paths:
      - .github/workflows/check-published-package.yml

permissions:
  contents: read

jobs:
  npx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version || 'latest' }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No checkout: npx must install the package from npm, not use the repo.
      # Installs can see a fresh version minutes after `npm view` does: they
      # read separate metadata that npm's CDN caches for up to 5 minutes. While
      # npm reports no such version, the step retries; any other failure fails
      # it at once.
      - name: Run the CLI from npm
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            if output=$(npx --yes "micdraw@$VERSION" --help 2>&1); then
              echo "$output"
              grep -q "Usage:" <<< "$output"
              exit
            fi
            if ! grep -qF "No matching version found for micdraw@$VERSION" <<< "$output"; then
              echo "$output"
              exit 1
            fi
            sleep 15
          done
          echo "$output"
          echo "::error::npm does not serve micdraw@$VERSION to installs after 10 minutes."
          exit 1

name: Release

# Publishing a GitHub Release for tag vX.Y.Z publishes that commit to npm.
# npm trusts this workflow by its file name (trusted publishing), so the repo
# holds no npm token. Renaming this file breaks publishing until the trust on
# npm is updated.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        id: tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json (v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish

  # Installs the version just published from npm and runs it on Linux, macOS
  # and Windows.
  check:
    needs: publish
    uses: ./.github/workflows/check-published-package.yml
    with:
      version: ${{ needs.publish.outputs.version }}

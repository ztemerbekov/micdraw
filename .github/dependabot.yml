version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Major versions arrive as separate pull requests: a new major of the AI SDK
    # changes how the agent talks to models, and the tests stub those calls.
    groups:
      npm:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
